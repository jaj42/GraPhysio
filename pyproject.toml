[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphysio"
version = "2025.9.21"
description = "Visualizer and analyser for biometric signals"
authors = [{ name = "Jona Joachim", email = "jona@joachim.cc" }]
requires-python = ">=3.10,<=3.14"
readme = "README.md"
license = "ISC"
dependencies = [
    "pyside6~=6.8",
    "pandas>=2,<3",
    "pathvalidate>=3,<4",
    "Pint>=0.24,<0.26",
    "pyqtgraph>=0.13,<0.14",
    "scipy~=1.15",
    "numexpr~=2.10",
    "pebble>=5.0.7,<6",
    "platformdirs>=3,<4",
    "physiocurve>=2024.12.16",
    "ecg-plot>=0.2.8,<0.3",
    "matplotlib>=3.10.0,<4",
    "dask[dataframe]>=2026.1.1",
    "mne>=1.11.0",
    "tsdownsample>=0.1.5.1",
]

[project.optional-dependencies]
dwc = ["dwclib[dwcmeta]>=2025.3.12"]
edf = ["pyEDFlib>=0.1.38"]
parquet = ["pyarrow>=14"]
shortcuts = ["pyshortcuts~=1.9"]
excel = ["python-calamine>=0.3.1,<0.4"]
iceberg = ["pyiceberg[sql-postgres,s3fs]>=0.9.1"]
all = [
    "dwclib[dwcmeta]>=2025.3.12",
    "pyEDFlib>=0.1.38",
    "pyarrow>=14",
    "pyshortcuts~=1.9",
    "pyiceberg[sql-postgres,s3fs]>=0.9.1",
]
server = [
    "fastapi>=0.136.3",
    "pyarrow>=21.0.0",
    "uvicorn[standard]>=0.49.0",
]

[project.urls]
Repository = "https://github.com/jaj42/GraPhysio"

[project.gui-scripts]
graphysio = "graphysio.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "poethepoet>=0.36.0",
    "pytest>=9.0.3",
]

[tool.poe.tasks]
graphysio = "uv run --extra=all graphysio"
